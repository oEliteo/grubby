version: "2"
sql:
  - schema: "sql/schema"
    queries: "sql/queries"
    engine: "postgresql"
    gen:
      go:
        out: "internal/database"
        overrides:
          - column: "recipes.ingredients"
            go_type:
              import: "grubby/internal/models"
              package: "models"
              type: "Ingredient"
              slice: true
          - column: "recipes.instructions"
            go_type:
              import: "grubby/internal/models"
              package: "models"
              type: "Instruction"
              slice: true
          - column: "recipes.nutrition"
            go_type:
              import: "grubby/internal/models"
              package: "models"
              type: "Nutrition"
              slice: false
              pointer: true
